<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2D5016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Essensplan">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Essensplan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F5F2ED;
      --surface: #FDFBF8;
      --surface2: #EDE9E2;
      --green: #2D5016;
      --green-light: #EBF0E3;
      --green-mid: #5A8A2E;
      --amber: #C17B2A;
      --amber-light: #FBF0E0;
      --coral: #C45231;
      --coral-light: #FAEDE8;
      --blue: #2A5580;
      --blue-light: #E5EFF7;
      --text: #1A1A18;
      --text2: #5A5850;
      --text3: #9A9788;
      --border: rgba(0,0,0,0.09);
      --radius: 14px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      overscroll-behavior: none;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    /* HEADER */
    .header {
      background: var(--green);
      color: white;
      padding: env(safe-area-inset-top, 0px) 20px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0 12px;
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .brand-name {
      font-family: 'Lora', serif;
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .user-switch {
      display: flex;
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 3px;
      gap: 2px;
    }

    .user-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.7);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 17px;
      cursor: pointer;
      transition: all .2s;
    }

    .user-btn.active {
      background: white;
      color: var(--green);
    }

    .week-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0 14px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .week-btn {
      background: none;
      border: none;
      color: rgba(255,255,255,0.8);
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      line-height: 1;
      transition: background .15s;
    }

    .week-btn:active { background: rgba(255,255,255,0.15); }

    .week-info { text-align: center; }

    .week-kw {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 2px;
    }

    .week-dates {
      font-size: 15px;
      font-weight: 500;
      color: white;
    }

    /* SUMMARY STRIP */
    .summary-strip {
      display: flex;
      gap: 8px;
      padding: 14px 20px 10px;
    }

    .sum-pill {
      flex: 1;
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      text-align: center;
    }

    .sum-val {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
    }

    .sum-lbl {
      font-size: 10px;
      color: var(--text3);
      margin-top: 1px;
      letter-spacing: .03em;
    }

    /* PLAN LIST */
    .plan-list {
      flex: 1;
      padding: 0 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .day-card {
      background: var(--surface);
      border: 0.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      cursor: pointer;
      transition: transform .12s, box-shadow .12s;
      -webkit-user-select: none;
      user-select: none;
    }

    .day-card:active {
      transform: scale(0.985);
    }

    .day-card.today {
      border-left: 3px solid var(--green-mid);
      background: var(--surface);
    }

    .day-label {
      min-width: 44px;
      padding-top: 2px;
    }

    .day-short {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--text3);
    }

    .day-date {
      font-size: 15px;
      font-weight: 500;
      margin-top: 2px;
    }

    .today-dot {
      width: 6px;
      height: 6px;
      background: var(--green-mid);
      border-radius: 50%;
      margin-top: 5px;
    }

    .meal-info { flex: 1; }

    .meal-name {
      font-family: 'Lora', serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--text);
    }

    .meal-desc {
      font-size: 12px;
      color: var(--text2);
      margin-top: 3px;
      line-height: 1.4;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 8px;
    }

    .tag {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 20px;
    }

    .tag-veg { background: var(--green-light); color: var(--green); }
    .tag-meat { background: var(--coral-light); color: var(--coral); }
    .tag-fish { background: var(--blue-light); color: var(--blue); }
    .tag-quick { background: var(--amber-light); color: var(--amber); }

    .kcal-col {
      text-align: right;
      padding-top: 2px;
      min-width: 46px;
    }

    .kcal-val {
      font-size: 15px;
      font-weight: 500;
      color: var(--text2);
    }

    .kcal-lbl {
      font-size: 10px;
      color: var(--text3);
      margin-top: 1px;
    }

    /* FOOTER */
    .footer {
      background: var(--surface);
      border-top: 0.5px solid var(--border);
      padding: 10px 20px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text3);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green-mid);
      flex-shrink: 0;
    }

    .sync-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: var(--green);
      background: var(--green-light);
      border: none;
      border-radius: var(--radius-sm);
      padding: 7px 14px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .sync-btn:active { opacity: 0.7; }

    .spin { animation: spin .7s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* INSTALL BANNER */
    .install-banner {
      margin: 12px 16px 0;
      background: var(--green-light);
      border: 0.5px solid rgba(45,80,22,0.2);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .install-text {
      font-size: 13px;
      color: var(--green);
      line-height: 1.4;
    }

    .install-close {
      background: none;
      border: none;
      color: var(--green);
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      flex-shrink: 0;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1A1C17;
        --surface: #23261E;
        --surface2: #2C2F26;
        --green-light: #1E2A14;
        --amber-light: #2A2010;
        --coral-light: #2A1810;
        --blue-light: #0E1E2E;
        --text: #F0EDE5;
        --text2: #A8A598;
        --text3: #686660;
        --border: rgba(255,255,255,0.08);
      }
      .green { color: #8ABF55; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-top">
      <div class="app-brand">
        <div class="brand-icon">🍽️</div>
        <span class="brand-name">Essensplan</span>
      </div>
      <div class="user-switch">
        <button class="user-btn active" onclick="switchUser('A', this)">Anna</button>
        <button class="user-btn" onclick="switchUser('B', this)">Ben</button>
      </div>
    </div>
    <div class="week-bar">
      <button class="week-btn" onclick="changeWeek(-1)">‹</button>
      <div class="week-info">
        <div class="week-kw" id="week-kw"></div>
        <div class="week-dates" id="week-dates"></div>
      </div>
      <button class="week-btn" onclick="changeWeek(1)">›</button>
    </div>
  </div>

  <div id="install-banner" class="install-banner" style="display:none">
    <div class="install-text">📲 Zum Homescreen hinzufügen: Teilen → „Zum Home-Bildschirm"</div>
    <button class="install-close" onclick="document.getElementById('install-banner').style.display='none'">×</button>
  </div>

  <div class="summary-strip" id="summary-strip"></div>

  <div class="plan-list" id="plan-list"></div>

  <div class="footer">
    <div class="footer-status">
      <div class="status-dot"></div>
      <span id="sync-label">Simulationsdaten · lokal</span>
    </div>
    <button class="sync-btn" id="sync-btn" onclick="doSync()">
      <span id="sync-icon">↻</span> Aktualisieren
    </button>
  </div>

</div>

<script>
const DAYS_LONG = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const DAYS_SHORT = ['Mo','Di','Mi','Do','Fr','Sa','So'];

const plans = {
  A: [
    [
      {name:'Spaghetti Bolognese',desc:'Mit Parmesan und frischem Basilikum',tags:['meat'],kcal:620},
      {name:'Griechischer Salat',desc:'Feta, Oliven, Tomate, Gurke',tags:['veg','quick'],kcal:340},
      {name:'Lachsfilet',desc:'Mit Dillsoße und Kartoffeln',tags:['fish'],kcal:520},
      {name:'Kürbissuppe',desc:'Mit Ingwer und Kokosmilch',tags:['veg'],kcal:310},
      {name:'Hühnchen-Curry',desc:'Mit Basmati-Reis und Naan',tags:['meat'],kcal:590},
      {name:'Flammkuchen',desc:'Speck, Crème fraîche, Zwiebeln',tags:['meat','quick'],kcal:480},
      {name:'Linsen-Dal',desc:'Mit Joghurt und Fladenbrot',tags:['veg'],kcal:430},
    ],
    [
      {name:'Rinderschmorbraten',desc:'Mit Rotkohl und Klößen',tags:['meat'],kcal:710},
      {name:'Gemüse-Stir-fry',desc:'Pak Choi, Brokkoli, Tofu',tags:['veg','quick'],kcal:360},
      {name:'Forelle Müllerin',desc:'Mit Mandelbuttersauce',tags:['fish'],kcal:490},
      {name:'Tomatensuppe',desc:'Mit Croutons und Basilikumöl',tags:['veg','quick'],kcal:280},
      {name:'Schnitzel Wiener Art',desc:'Mit Kartoffelsalat',tags:['meat'],kcal:650},
      {name:'Pizza Margherita',desc:'Selbst gemacht, knuspriger Boden',tags:['veg'],kcal:540},
      {name:'Ratatouille',desc:'Provenzalisches Gemüsegericht',tags:['veg'],kcal:320},
    ],
    [
      {name:'Pad Thai',desc:'Mit Garnelen und Erdnüssen',tags:['fish','quick'],kcal:560},
      {name:'Caprese-Salat',desc:'Büffelmozzarella, Tomaten, Pesto',tags:['veg'],kcal:390},
      {name:'Hähnchen-Shawarma',desc:'Im Fladenbrot mit Tzatziki',tags:['meat'],kcal:610},
      {name:'Möhren-Ingwer-Suppe',desc:'Cremig, mit Crème fraîche',tags:['veg','quick'],kcal:270},
      {name:'Seelachs-Filet',desc:'Mit Erbsenreis und Zitronenbutter',tags:['fish'],kcal:470},
      {name:'Pasta Carbonara',desc:'Original mit Ei und Guanciale',tags:['meat'],kcal:680},
      {name:'Veggie-Burger',desc:'Mit Süßkartoffel-Pommes',tags:['veg'],kcal:580},
    ],
  ],
  B: [
    [
      {name:'Pulled Pork Burger',desc:'Im Brioche-Bun mit Coleslaw',tags:['meat'],kcal:720},
      {name:'Caesar Salad',desc:'Mit gegrilltem Hühnchen',tags:['meat','quick'],kcal:420},
      {name:'Sushi-Bowl',desc:'Lachs, Avocado, Edamame',tags:['fish'],kcal:500},
      {name:'Minestrone',desc:'Klassische italienische Gemüsesuppe',tags:['veg'],kcal:290},
      {name:'Rindergulasch',desc:'Mit Spätzle und Gurken-Essigsalat',tags:['meat'],kcal:640},
      {name:'Shakshuka',desc:'Eier in pikanter Tomatensauce',tags:['veg','quick'],kcal:380},
      {name:'Couscous-Tajine',desc:'Mit Kichererbsen und Aprikosen',tags:['veg'],kcal:410},
    ],
    [
      {name:'Spare Ribs',desc:'BBQ-glasiert mit Maisbrot',tags:['meat'],kcal:780},
      {name:'Buddha Bowl',desc:'Quinoa, Avocado, Kimchi',tags:['veg'],kcal:450},
      {name:'Garnelen-Pasta',desc:'Aglio e olio mit Cherry-Tomaten',tags:['fish','quick'],kcal:530},
      {name:'Zwiebelsuppe',desc:'Mit Gruyère-Crouton überbacken',tags:['meat'],kcal:350},
      {name:'Enchiladas',desc:'Mit Hähnchen und Guacamole',tags:['meat'],kcal:660},
      {name:'Zucchini-Frittata',desc:'Mit Feta und getrockneten Tomaten',tags:['veg','quick'],kcal:310},
      {name:'Lamm-Kofta',desc:'Mit Hummus und Fladenbrot',tags:['meat'],kcal:590},
    ],
    [
      {name:'Tacos al Pastor',desc:'Mit Ananas und Koriander',tags:['meat'],kcal:550},
      {name:'Spinat-Ricotta-Ravioli',desc:'Mit brauner Butter',tags:['veg'],kcal:490},
      {name:'Thunfisch-Tartare',desc:'Mit Avocado und Sesam-Cracker',tags:['fish','quick'],kcal:420},
      {name:'Rote-Linsen-Suppe',desc:'Mit Cumin und Zitrone',tags:['veg','quick'],kcal:300},
      {name:'Saftgulasch',desc:'Mit Semmelknödel',tags:['meat'],kcal:700},
      {name:'Focaccia-Pizza',desc:'Mit Ziegenkäse und Feige',tags:['veg'],kcal:560},
      {name:'Mango-Curry',desc:'Mit Kokosmilch und Jasminreis',tags:['veg'],kcal:440},
    ],
  ]
};

let user = 'A';
let weekOffset = 0;

function getWeekDates(offset) {
  const now = new Date();
  const dow = now.getDay();
  const diff = dow === 0 ? -6 : 1 - dow;
  const mon = new Date(now);
  mon.setDate(now.getDate() + diff + offset * 7);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

function getISOWeek(d) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  dt.setUTCDate(dt.getUTCDate() + 4 - (dt.getUTCDay()||7));
  const y = new Date(Date.UTC(dt.getUTCFullYear(),0,1));
  return Math.ceil((((dt - y) / 86400000) + 1) / 7);
}

function fmt(d) {
  return d.getDate() + '.' + (d.getMonth()+1) + '.';
}

function isToday(d) {
  const t = new Date();
  return d.getDate()===t.getDate() && d.getMonth()===t.getMonth() && d.getFullYear()===t.getFullYear();
}

function tagHtml(tags) {
  const map = {
    veg: ['tag-veg','Vegetarisch'],
    meat: ['tag-meat','Fleisch'],
    fish: ['tag-fish','Fisch'],
    quick: ['tag-quick','Schnell'],
  };
  return tags.map(t => `<span class="tag ${map[t][0]}">${map[t][1]}</span>`).join('');
}

function render() {
  const dates = getWeekDates(weekOffset);
  const kw = getISOWeek(dates[0]);

  document.getElementById('week-kw').textContent = 'Kalenderwoche ' + kw;
  document.getElementById('week-dates').textContent = fmt(dates[0]) + ' – ' + fmt(dates[6]) + ' ' + dates[6].getFullYear();

  const wIdx = ((weekOffset % 3) + 3) % 3;
  const meals = plans[user][wIdx];

  let totalKcal = 0, veg = 0, quick = 0;
  let html = '';

  meals.forEach((m, i) => {
    const d = dates[i];
    const today = isToday(d);
    totalKcal += m.kcal;
    if (m.tags.includes('veg')) veg++;
    if (m.tags.includes('quick')) quick++;

    html += `<div class="day-card${today?' today':''}">
      <div class="day-label">
        <div class="day-short">${DAYS_SHORT[i]}</div>
        <div class="day-date">${d.getDate()}.</div>
        ${today ? '<div class="today-dot"></div>' : ''}
      </div>
      <div class="meal-info">
        <div class="meal-name">${m.name}</div>
        <div class="meal-desc">${m.desc}</div>
        <div class="tags">${tagHtml(m.tags)}</div>
      </div>
      <div class="kcal-col">
        <div class="kcal-val">${m.kcal}</div>
        <div class="kcal-lbl">kcal</div>
      </div>
    </div>`;
  });

  document.getElementById('plan-list').innerHTML = html;

  const avg = Math.round(totalKcal / 7);
  document.getElementById('summary-strip').innerHTML = `
    <div class="sum-pill"><div class="sum-val">${avg}</div><div class="sum-lbl">Ø kcal/Tag</div></div>
    <div class="sum-pill"><div class="sum-val">${veg}×</div><div class="sum-lbl">Vegetarisch</div></div>
    <div class="sum-pill"><div class="sum-val">${quick}×</div><div class="sum-lbl">Schnell</div></div>`;
}

function changeWeek(dir) {
  weekOffset += dir;
  render();
}

function switchUser(u, btn) {
  user = u;
  document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function doSync() {
  const icon = document.getElementById('sync-icon');
  icon.className = 'spin';
  icon.textContent = '↻';
  setTimeout(() => {
    icon.className = '';
    const now = new Date();
    document.getElementById('sync-label').textContent =
      'Aktualisiert ' + now.toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'}) + ' Uhr';
  }, 1200);
}

// Service Worker registrieren
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

// Install-Banner: auf iOS anzeigen wenn nicht installiert
const isIos = /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
const isStandalone = window.navigator.standalone;
if (isIos && !isStandalone) {
  document.getElementById('install-banner').style.display = 'flex';
}

render();
</script>
</body>
</html>
